name: Normalize Case Study Video Audio

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize case-study hero videos
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          changed = []
          for path in Path('.').glob('*.html'):
              if path.name == 'index.html':
                  continue
              text = path.read_text(encoding='utf-8')

              pattern = re.compile(r'(<header\\s+class=["\']hero["\'][\\s\\S]*?<video\\s+)([^>]+)(>)', re.I)

              def normalize(match):
                  attrs = match.group(2)
                  if not re.search(r'\bsrc=', attrs, re.I) and 'poster=' not in attrs:
                      pass
                  attrs = re.sub(r'\s+autoplay(?:\s*=\s*(?:"[^"]*"|\'[^\']*\'|[^\s>]+))?', '', attrs, flags=re.I)
                  attrs = re.sub(r'\s+muted(?:\s*=\s*(?:"[^"]*"|\'[^\']*\'|[^\s>]+))?', '', attrs, flags=re.I)
                  attrs = re.sub(r'\s+loop(?:\s*=\s*(?:"[^"]*"|\'[^\']*\'|[^\s>]+))?', '', attrs, flags=re.I)
                  attrs = re.sub(r'\s+controls(?:\s*=\s*(?:"[^"]*"|\'[^\']*\'|[^\s>]+))?', '', attrs, flags=re.I)
                  attrs = re.sub(r'\s+preload\s*=\s*(?:"[^"]*"|\'[^\']*\'|[^\s>]+)', '', attrs, flags=re.I)
                  if not re.search(r'\bcontrols\b', attrs, re.I):
                      attrs += ' controls'
                  if not re.search(r'\bplaysinline\b', attrs, re.I):
                      attrs += ' playsinline'
                  attrs += ' preload="metadata"'
                  return match.group(1) + attrs.strip() + match.group(3)

              updated, count = pattern.subn(normalize, text, count=1)
              if count and updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.name)

          print('Normalized:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit normalized pages and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/normalize-case-study-video-audio.yml
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git add '*.html' .github/workflows/normalize-case-study-video-audio.yml
          git commit -m "Fix case-study video audio controls"
          git push
