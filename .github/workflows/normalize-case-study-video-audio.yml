name: Normalize case-study video audio behavior

on:
  push:
    branches: [main]

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize case-study video tags
        shell: python
        run: |
          from pathlib import Path
          import re

          pages = [
              p for p in Path('.').glob('*.html')
              if p.name != 'index.html'
          ]

          changed = []
          pattern = re.compile(r'<video\b([^>]*)>', re.I)

          def normalize(match):
              attrs = match.group(1)
              original = attrs
              attrs = re.sub(r'\s+autoplay(?:\s*=\s*(?:"[^"]*"|\'[^\']*\'|[^\s>]+))?', '', attrs, flags=re.I)
              attrs = re.sub(r'\s+muted(?:\s*=\s*(?:"[^"]*"|\'[^\']*\'|[^\s>]+))?', '', attrs, flags=re.I)
              attrs = re.sub(r'\s+loop(?:\s*=\s*(?:"[^"]*"|\'[^\']*\'|[^\s>]+))?', '', attrs, flags=re.I)
              if not re.search(r'\bcontrols(?:\s*=|\s|$)', attrs, re.I):
                  attrs += ' controls'
              if not re.search(r'\bplaysinline(?:\s*=|\s|$)', attrs, re.I):
                  attrs += ' playsinline'
              if not re.search(r'\bpreload\s*=', attrs, re.I):
                  attrs += ' preload="metadata"'
              return '<video' + attrs + '>'

          for page in pages:
              text = page.read_text(encoding='utf-8')
              new = pattern.sub(normalize, text)
              if new != text:
                  page.write_text(new, encoding='utf-8')
                  changed.append(str(page))

          print('Normalized:', ', '.join(changed) if changed else 'none')

      - name: Commit normalized pages and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/normalize-case-study-video-audio.yml
          git add '*.html'
          if git diff --cached --quiet; then
            git commit -m "Normalize case-study video audio behavior" || true
          else
            git commit -m "Normalize case-study video audio behavior"
          fi
          git push
