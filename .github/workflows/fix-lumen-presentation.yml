name: Fix LUMEN presentation and inspect automotive audio

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Inspect Car Rental / automotive audio track
        run: |
          if [ -f "assets/automotive.mp4" ]; then
            echo "=== assets/automotive.mp4 stream metadata ==="
            ffprobe -v error -show_entries stream=index,codec_type,codec_name,channels,sample_rate -of compact=p=0:nk=1 "assets/automotive.mp4"
          else
            echo "assets/automotive.mp4 not found"
          fi

      - name: Remove temporary diagnostic workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-lumen-presentation.yml
          git commit -m "Remove temporary media diagnostic workflow"
          git push
