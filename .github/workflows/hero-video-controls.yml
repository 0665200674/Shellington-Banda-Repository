name: Add cinematic hero video controls

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add custom film controls
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css = '''.hero-video-control{position:absolute;z-index:4;left:clamp(20px,4vw,52px);bottom:clamp(22px,4vh,46px);appearance:none;border:1px solid rgba(242,240,235,.45);background:rgba(17,17,15,.32);backdrop-filter:blur(10px);color:#f2f0eb;padding:12px 16px;font:600 10px/1 Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:background .2s ease,border-color .2s ease,transform .2s ease}.hero-video-control:hover{background:rgba(17,17,15,.62);border-color:rgba(242,240,235,.75);transform:translateY(-1px)}.hero-video-control:focus-visible{outline:2px solid currentColor;outline-offset:3px}.hero:after{pointer-events:none}'''

          script = '''<script>
          (()=>{const hero=document.querySelector('.hero');if(!hero)return;const video=hero.querySelector('video');if(!video)return;const button=document.createElement('button');button.type='button';button.className='hero-video-control';button.setAttribute('aria-label','Play film with sound');button.textContent='▶ PLAY FILM · SOUND ON';hero.appendChild(button);video.removeAttribute('controls');video.removeAttribute('autoplay');video.removeAttribute('muted');video.removeAttribute('loop');video.setAttribute('playsinline','');video.setAttribute('preload','metadata');video.addEventListener('play',()=>{button.textContent='❚❚ PAUSE · SOUND ON';button.setAttribute('aria-label','Pause film');});video.addEventListener('pause',()=>{button.textContent='▶ RESUME · SOUND ON';button.setAttribute('aria-label','Resume film with sound');});video.addEventListener('ended',()=>{button.textContent='↻ REPLAY · SOUND ON';button.setAttribute('aria-label','Replay film with sound');});button.addEventListener('click',()=>{if(video.paused||video.ended){if(video.ended)video.currentTime=0;video.muted=false;const p=video.play();if(p)p.catch(()=>{video.controls=true;});}else{video.pause();}});})();
          </script>'''

          for path in sorted(Path('.').glob('*.html')):
              if path.name == 'index.html':
                  continue
              text = path.read_text(encoding='utf-8')
              if 'hero-video-control' in text:
                  continue
              # Normalize the hero video so audio is enabled only after the visitor clicks.
              text = re.sub(r'(<header class="hero">\s*<video)([^>]*)(>)', lambda m: m.group(1) + re.sub(r'\s+(?:autoplay|muted|loop|controls)(?=\s|=|>)', '', m.group(2)) + ' playsinline preload="metadata"' + m.group(3), text, count=1)
              text = text.replace('</style>', css + '</style>', 1)
              text = re.sub(r'(</video>)', r'\1', text, count=1)
              text = text.replace('</header>', '</header>', 1)
              text = text.replace('</body>', script + '</body>', 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git diff --cached --quiet && exit 0
          git commit -m "Add custom play film controls to case studies"
          git push
