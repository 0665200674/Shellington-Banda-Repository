name: Move Beauty UGC Card

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move Beauty UGC next to health and skin care work
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          pattern = re.compile(r'<a class="card" href="beauty-creator-content\.html">.*?</a>', re.S)
          match = pattern.search(html)
          if not match:
              raise SystemExit('Beauty/UGC card not found')
          card = match.group(0)
          html = html[:match.start()] + html[match.end():]

          anchor = re.compile(r'<a class="card" href="ava-vera-skin-dew\.html">.*?</a>', re.S)
          target = anchor.search(html)
          if not target:
              raise SystemExit('AVA VERA skin-care card not found')

          insert_at = target.end()
          html = html[:insert_at] + card + html[insert_at:]
          path.write_text(html, encoding='utf-8')

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Move Beauty UGC next to health and skin care work"
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/move-beauty-ugc.yml || true
          git commit -m "Remove temporary Beauty UGC workflow" || true
          git push || true
