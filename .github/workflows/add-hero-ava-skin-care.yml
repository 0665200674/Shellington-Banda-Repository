name: Add Hero Ava skin care campaigns
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add skin care campaign cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<a class="card lumen-card" href="lumen.html">'
          cards='''<a class="card" href="ava-nova-skin-care.html"><video autoplay muted loop playsinline poster="assets/beauty.jpg"><source src="assets/AVA NOVA SKIN CARE AD.mp4" type="video/mp4"></video><div class="card-info"><div class="label">AI Advertising · Skin Care</div><div class="title">AVA NOVA</div><div class="meta">Hero Ava · skin care · beauty advertising</div></div></a><a class="card" href="ava-vera-skin-dew.html"><video autoplay muted loop playsinline poster="assets/beauty.jpg"><source src="assets/AVA VERA SKIN DEW SKIN CARE AD.mp4" type="video/mp4"></video><div class="card-info"><div class="label">AI Advertising · Skin Care</div><div class="title">AVA VERA SKIN DEW</div><div class="meta">Hero Ava · skin care · beauty advertising</div></div></a>'''
          if 'href="ava-nova-skin-care.html"' not in s:
              if marker not in s: raise SystemExit('LUMEN+ card marker not found')
              s=s.replace(marker,cards+marker,1)
              p.write_text(s)
          else:
              print('Skin care cards already present')
          PY
      - name: Commit homepage update and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add index.html .github/workflows/add-hero-ava-skin-care.yml
          git commit -m "Add Hero Ava skin care campaigns"
          git push
